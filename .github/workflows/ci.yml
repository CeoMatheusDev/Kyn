name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build, tests and IR validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System dependencies (venv for the toolchain, LLVM for the IR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv llvm

      - name: Install Zig 0.17.0 (official PyPI wheel)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zig-venv"
          "$RUNNER_TEMP/zig-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/zig-venv/bin/pip" install --quiet "ziglang==0.17.0.post0"
          ZIG_BIN="$("$RUNNER_TEMP/zig-venv/bin/python" -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          test -x "$ZIG_BIN"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$ZIG_BIN" "$RUNNER_TEMP/bin/zig"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "Zig installed at $ZIG_BIN"

      - name: Available tools
        run: |
          zig version
          as --version | head -1
          ld --version | head -1
          (llvm-as --version || /usr/lib/llvm-*/bin/llvm-as --version) | head -3

      - name: Formatting (zig fmt --check)
        run: zig fmt --check build.zig src std

      - name: Unit tests
        run: zig build test --summary all

      - name: End to end (assembly -> as/ld -> execution)
        run: zig build e2e

      - name: Validate LLVM IR with llvm-as (strict)
        run: zig build validate-ir-strict

  extension-check:
    name: VS Code extension validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate extension JavaScript
        working-directory: extension
        run: npm run check

      - name: Validate extension manifests
        working-directory: extension
        run: |
          node -e "for (const f of ['package.json', 'language-configuration.json', 'syntaxes/kyn.tmLanguage.json', 'snippets/kyn.json', '.vscode/launch.json']) JSON.parse(require('node:fs').readFileSync(f, 'utf8')); console.log('Extension JSON manifests are valid.')"

      - name: Package VSIX
        working-directory: extension
        run: |
          npm install --global @vscode/vsce
          vsce package --no-dependencies --out "$RUNNER_TEMP/kyn-language.vsix"
          test -s "$RUNNER_TEMP/kyn-language.vsix"
